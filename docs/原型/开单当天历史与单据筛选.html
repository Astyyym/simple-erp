<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>简单ERP · 开单与筛选交互原型</title>
<style>
:root{color-scheme:light;--ink:#172638;--muted:#617187;--line:#ccd6e2;--blue:#2060dc;--surface:#fff;--wash:#eff4fa;--soft:#f6f9fc}
*{box-sizing:border-box}body{margin:0;background:var(--wash);color:var(--ink);font:15px/1.5 "Microsoft YaHei",system-ui,sans-serif}
.wrap{max-width:1220px;margin:28px auto;padding:0 24px}h1{margin:0 0 4px;font-size:24px}h2{margin:0;font-size:19px}p{margin:0;color:var(--muted)}.hint{margin:8px 0 22px}.tabs{display:flex;gap:8px;margin:20px 0}.tabs button{background:transparent}.tabs button.on{background:var(--blue);color:#fff;border-color:var(--blue)}button,.link{border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--ink);padding:10px 14px;font:inherit;cursor:pointer;white-space:nowrap}button:focus-visible,.link:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--blue);outline-offset:2px}.primary{background:var(--blue);color:#fff;border-color:var(--blue)}.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:22px;margin-bottom:20px;box-shadow:0 9px 28px #1835510b}.grid{display:grid;grid-template-columns:minmax(190px,1.1fr) minmax(300px,1.15fr) minmax(290px,1.2fr) minmax(170px,.8fr);gap:16px;align-items:end}.field label{display:block;margin-bottom:7px;color:#52637a;font-weight:600}.field input,.field select{height:43px;width:100%;padding:7px 11px;border:1px solid var(--line);border-radius:7px;background:white;font:inherit}.mode{display:flex;flex-wrap:wrap;gap:8px}.mode button{border-radius:8px}.mode button.on{background:var(--blue);border-color:var(--blue);color:#fff;position:relative}.dates{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}.dates.two{grid-template-columns:repeat(2,minmax(0,1fr))}.dates.one{grid-template-columns:minmax(130px,200px)}.actions{margin-top:24px;padding-top:20px;border-top:1px solid var(--line);display:flex;gap:20px;align-items:center;flex-wrap:wrap}.action-group{display:flex;gap:8px;flex-wrap:wrap}.export{border-color:#2f9c71;color:#167051}.form-note{margin-top:13px;font-size:13px}.order-form{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}.order-form .wide{grid-column:1/-1}.order-form .buttons{text-align:right}.table-wrap{overflow-x:auto}table{width:100%;border-collapse:collapse;min-width:760px}th,td{text-align:left;padding:13px 10px;border-bottom:1px solid #e2e9f0}th{font-size:13px;color:#64758b;background:var(--soft)}.row-actions{display:flex;gap:8px}.row-actions button{padding:6px 11px}.badge{display:inline-block;padding:3px 8px;border-radius:5px;background:#e9f1ff;color:#174baf}.muted{font-size:13px;color:var(--muted)}[hidden]{display:none!important}#notice{min-height:24px;color:#236046;margin:10px 0}button:disabled{opacity:.55;cursor:not-allowed}@media(max-width:1050px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:680px){.grid,.order-form{grid-template-columns:1fr}.dates{grid-template-columns:repeat(2,minmax(0,1fr))}.actions{align-items:flex-start;flex-direction:column}.wrap{padding:0 14px}table{min-width:670px}}
</style>
</head>
<body><main class="wrap"><h1>开单当天历史 × 单据筛选</h1><p class="hint">交互原型 · 以下客户和订单均为虚构数据，不连接业务库、不生成真实导出。</p>
<div class="tabs"><button id="entryTab" class="on" type="button">开单页</button><button id="listTab" type="button">单据管理</button></div>
<section id="entryPage"><div class="card"><h2>新建销售单</h2><p class="hint">演示业务日期与下方“当天历史开单”的关系。</p>
<div class="order-form"><div class="field"><label for="customer">客户名称</label><input id="customer" value="示例消防门店"></div><div class="field"><label for="entryDate">销售日期</label><input type="date" id="entryDate"></div><div class="field"><label>单号</label><input readonly value="MD+日期+流水（示意）"></div><div class="field"><label>状态</label><select><option>正式保存</option><option>草稿</option></select></div><div class="field wide"><label>商品明细（示意）</label><input value="演示商品　× 1　　 ¥128.00" readonly></div><div class="wide buttons"><button type="button" class="primary" id="simulateSave">模拟保存（不写库）</button></div></div></div>
<div class="card"><h2>当天历史开单</h2><p class="hint" id="historyHint"></p><div class="table-wrap"><table><thead><tr><th>单号</th><th>客户</th><th>类型</th><th>金额</th><th>状态</th><th>操作</th></tr></thead><tbody id="historyRows"></tbody></table></div><p class="form-note">这里只按单据业务日期展示今天的有效单据。昨天的补录或修改，不会进入今天。</p></div></section>
<section id="listPage" hidden><div class="card"><h2>单据管理</h2><p class="hint">切换模式只更换日期输入框；点击“筛选”后才更新结果。操作区的位置和按钮不变。</p>
<div class="grid"><div class="field"><label>客户名称</label><input placeholder="输入客户名称"></div><div class="field"><label>时间模式</label><div class="mode" role="group" aria-label="时间模式"><button type="button" class="on" data-mode="year">按年</button><button type="button" data-mode="month">按月</button><button type="button" data-mode="range">按日到日</button></div></div><div class="field"><label>日期范围</label><div id="yearFields" class="dates one"><input type="number" aria-label="年份" value="2026"></div><div id="monthFields" class="dates" hidden><input type="number" aria-label="开始年" value="2026"><select aria-label="开始月"><option>9月</option></select><input type="number" aria-label="结束年" value="2026"><select aria-label="结束月"><option>9月</option></select></div><div id="rangeFields" class="dates two" hidden><input type="date" aria-label="开始日期"><input type="date" aria-label="结束日期"></div></div><div class="field"><label>订单类型</label><select><option>全部</option><option>只看销售单</option><option>只看退货单</option></select></div></div>
<div class="actions"><div class="action-group"><button type="button" class="primary" data-action="筛选">筛选</button><button type="button" data-action="清除筛选条件">清除筛选条件</button></div><div class="action-group"><button type="button" data-action="导出汇总表">导出汇总表</button><button type="button" class="export" data-action="导出销售单Excel">导出销售单Excel</button><button type="button" class="export" data-action="导出退货单Excel">导出退货单Excel</button></div></div><p class="form-note">汇总表仍汇总销售与退货；两个 Excel 分别固定销售、退货。这里仅展示布局和切换，不执行导出。</p></div><div class="card"><h2>筛选结果区域（示意）</h2><p id="resultInfo">点击“筛选”后更新。</p></div></section><div id="notice" role="status"></div></main>
<script>
const today = new Date(); const iso = new Date(today.getTime() - today.getTimezoneOffset()*60000).toISOString().slice(0,10);
document.querySelector('#entryDate').value=iso; document.querySelectorAll('#rangeFields input').forEach(i=>i.value=iso);
const history=[{no:'MD'+iso.replaceAll('-','')+'0001',name:'示例消防门店',type:'销售单',amount:'¥128.00'}];
function renderHistory(){document.querySelector('#historyHint').textContent=`业务日期 · ${iso}（与录入/修改时间无关）`;document.querySelector('#historyRows').innerHTML=history.map((o,i)=>`<tr><td>${o.no}</td><td>${o.name}</td><td>${o.type}</td><td>${o.amount}</td><td><span class="badge">正式保存</span></td><td class="row-actions"><button type="button" data-row="${i}" data-action="回看">回看</button><button type="button" data-row="${i}" data-action="修改">修改</button></td></tr>`).join('')||'<tr><td colspan="6">今天还没有有效单据</td></tr>'}
renderHistory();
function tab(which){const entry=which==='entry';document.querySelector('#entryPage').hidden=!entry;document.querySelector('#listPage').hidden=entry;document.querySelector('#entryTab').classList.toggle('on',entry);document.querySelector('#listTab').classList.toggle('on',!entry);document.querySelector('#notice').textContent=''}
document.querySelector('#entryTab').onclick=()=>tab('entry');document.querySelector('#listTab').onclick=()=>tab('list');
document.querySelector('#simulateSave').onclick=()=>{const selected=document.querySelector('#entryDate').value;if(selected===iso){history.unshift({no:'MD'+iso.replaceAll('-','')+String(history.length+1).padStart(4,'0'),name:'演示新单',type:'销售单',amount:'¥128.00'});renderHistory();document.querySelector('#notice').textContent='演示：今天业务日期的新单已进入下方列表。'}else document.querySelector('#notice').textContent='演示：补录其他业务日期的单，不进入今天列表。';};
document.querySelectorAll('[data-mode]').forEach(btn=>btn.onclick=()=>{document.querySelectorAll('[data-mode]').forEach(b=>b.classList.toggle('on',b===btn));['year','month','range'].forEach(mode=>document.querySelector('#'+mode+'Fields').hidden=mode!==btn.dataset.mode);});
document.querySelectorAll('[data-action]').forEach(btn=>btn.onclick=()=>{const label=btn.dataset.action;document.querySelector('#notice').textContent=btn.dataset.row!==undefined?`演示：${label}单据 ${history[Number(btn.dataset.row)].no}；正式页面将进入既有订单路径。`:`演示：${label}；正式页面沿用现有筛选或导出逻辑。`;if(label==='筛选')document.querySelector('#resultInfo').textContent='已按当前日期模式提交筛选（交互示意）';});
</script></body></html>
