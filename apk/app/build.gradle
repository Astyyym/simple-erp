import java.util.Properties

plugins {
    id 'com.android.application'
}

def keystorePropertiesFile = rootProject.file("keystore.properties")
def hasKeystore = keystorePropertiesFile.exists()
def keystoreProperties = new Properties()
if (hasKeystore) {
    keystorePropertiesFile.withInputStream { keystoreProperties.load(it) }
}

def mobileVersionName = new File(rootProject.projectDir, "VERSION").text.trim()

android {
    namespace 'com.simpleerp.mobile'
    compileSdk 36

    defaultConfig {
        applicationId "com.simpleerp.mobile"
        minSdk 24
        targetSdk 36
        versionCode 1
        versionName mobileVersionName
    }

    signingConfigs {
        if (hasKeystore) {
            release {
                storeFile rootProject.file(keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            if (hasKeystore) {
                signingConfig signingConfigs.release
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError false
    }
}
