import java.util.Properties

plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.compose'
    id 'org.jetbrains.kotlin.plugin.serialization'
}

def keystorePropertiesFile = rootProject.file("keystore.properties")
def hasKeystore = keystorePropertiesFile.exists()
def keystoreProperties = new Properties()
if (hasKeystore) {
    keystorePropertiesFile.withInputStream { keystoreProperties.load(it) }
}

// 版本号跟壳保持一致：native/VERSION 是原生端自己的版本，与 Python 端 VERSION 无关。
def nativeVersionName = new File(rootProject.projectDir, "VERSION").text.trim()

android {
    namespace 'com.simpleerp.mobile'
    compileSdk 36

    defaultConfig {
        applicationId "com.simpleerp.mobile"
        minSdk 24
        targetSdk 36
        versionCode 13
        versionName nativeVersionName
    }

    signingConfigs {
        if (hasKeystore) {
            release {
                storeFile rootProject.file(keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            if (hasKeystore) {
                signingConfig signingConfigs.release
            }
        }
    }

    buildFeatures {
        compose true
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    lint {
        abortOnError false
        // 自用 App、不上架，release 不跑 lint：`lintVitalRelease` 要单独拉
        // `com.android.tools.lint:lint-gradle`，国内网络经常拉不下来，
        // 结果是「代码没问题但构建失败」。debug 构建仍然保留 lint 任务。
        checkReleaseBuilds false
    }
}

dependencies {
    def composeBom = platform('androidx.compose:compose-bom:2025.01.00')
    implementation composeBom
    androidTestImplementation composeBom

    implementation 'androidx.core:core-ktx:1.15.0'
    implementation 'androidx.activity:activity-compose:1.9.3'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.8.7'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.8.7'

    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-graphics'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.material:material-icons-core'

    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.9.0'
    implementation 'org.jetbrains.kotlinx:kotlinx-serialization-json:1.7.3'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'androidx.datastore:datastore-preferences:1.1.1'

    // 扫码配对：用 zxing-android-embedded，它自带 CaptureActivity 与权限处理，
    // 比自己接 CameraX + ML Kit 少写几百行，而且不依赖 Google Play 服务
    // （店主的手机可能没有 GMS，ML Kit 会直接不可用）。
    implementation 'com.journeyapps:zxing-android-embedded:4.3.0'

    debugImplementation 'androidx.compose.ui:ui-tooling'

    // 单元测试：二维码解析这类纯逻辑用 JVM 测试比在模拟器里扫快得多，
    // 而且能在 CI 里跑。
    testImplementation 'junit:junit:4.13.2'
}
