            <div class="menu" id="ioMenu">
              <button data-toast="下载 Excel 模板（示例）">下载 Excel 模板</button>
              <button data-toast="批量导入（示例）">批量导入</button>
              <div class="sep"></div>

            </div>
          </div>
        </div>

          <div class="adv-group"><span class="adv-label">档案筛选</span>

            <button class="chip" data-kind="排序" data-val="价格">按价格</button>
            <span class="adv-actions"><button class="btn text" id="resetChips">重置</button></span>
          </div>
        </div></div></div>
        <div class="active-tags" id="activeTags"></div>
      </div>
