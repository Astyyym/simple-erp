<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>资料文档 · 去乱方案A（一条工具带）</title>
<link rel="stylesheet" href="_shell.css">
<style>
  .dc-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px;margin-bottom:16px}
  /* 方案A核心：把「搜索」与「上传」压成同一条工具带，一行搞定，去掉单独的搜索大行 */
  .dc-bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .dc-search{display:flex;align-items:center;gap:8px;flex:1 1 240px;min-width:220px;height:38px;border:1px solid var(--border);border-radius:8px;padding:0 12px;background:#fff}
  .dc-search svg{width:16px;height:16px;color:var(--muted);flex:0 0 auto}
  .dc-search input{border:0;outline:none;flex:1;height:100%;font:inherit;font-size:13.5px;background:transparent;color:var(--ink)}
  .dc-select,.dc-note{height:38px;border:1px solid var(--border);border-radius:8px;padding:0 10px;font:inherit;font-size:13px;background:#fff;color:var(--ink)}
  .dc-note{flex:0 1 150px;min-width:120px}
  .dc-file{display:inline-flex;align-items:center;gap:8px;height:38px;padding:0 12px;border:1px dashed var(--border-strong);border-radius:8px;color:var(--muted);font-size:13px;cursor:pointer;white-space:nowrap;background:#fff}
  .dc-file b{color:var(--primary);font-weight:650}
  .var-tag{display:inline-flex;align-items:center;height:28px;padding:0 12px;border-radius:14px;background:var(--primary);color:#fff;font-size:12.5px;font-weight:700}
  .dc-preview{width:54px;height:54px;border-radius:8px;background:linear-gradient(135deg,#5b7db1,#3f5d8a);border:1px solid var(--border)}
  .dc-title{font-weight:650}
  .dc-sub{color:var(--muted);font-size:12px}
</style>
</head><body>
<div class="app-shell">
  <aside class="sidebar">
    <div class="brand"><span class="brand-mark"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3.6H9C7.3 3.6 5.9 5 5.9 6.7V17.3C5.9 19 7.3 20.4 9 20.4H15C16.7 20.4 18.1 19 18.1 17.3V7.7L14 3.6ZM14 3.6V6C14 7.3 15.1 8.4 16.4 8.4H18.1M9 12.4H10.6M13.4 12.4H15M9 15.8H10.6M13.4 15.8H15"/></svg></span><span class="brand-title">简单ERP</span></div>
    <a href="#"><svg class="nav-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>工作台</a>
    <div class="nav-label">开单</div>
    <a class="sub" href="#">销售单</a><a class="sub" href="#">退货单</a><a class="sub" href="#">拿货单</a><a class="sub" href="#">退拿货单</a>
    <div class="nav-label">业务</div>
    <a href="#">单据管理</a><a href="#">账款管理</a><a href="#">数据分析</a>
    <div class="nav-label">基础资料</div>
    <a href="#">商品管理</a><a href="#">客户管理</a><a class="active" href="#">资料文档</a>
    <div class="nav-label">其他</div>
    <a href="#">回收站</a><a href="#">系统设置</a>
  </aside>
  <div class="content">
    <div class="topbar">
      <div class="search"><input placeholder="搜索单号 / 客户 / 商品 / 资料…"><button class="btn primary" style="height:36px">搜索</button></div>
      <div class="clock" id="clock">2026-11-08 18:40:00</div>
      <div class="status"><i></i>本地数据已连接</div>
    </div>
    <div class="page-body">
      <div class="page-head">
        <div><h1>资料文档</h1><div class="sub">纯文件柜：检验报告、合格证、资质证书等；可直接打开或打印。</div></div>
        <span class="var-tag">方案 A · 一条工具带</span>
      </div>

      <section class="dc-card">
        <!-- 方案A：搜索 + 分类 + 选文件 + 备注 + 上传 全在一条里 -->
        <div class="dc-bar">
          <label class="dc-search">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
            <input type="search" placeholder="搜索标题 / 原文件名 / 备注，回车搜索">
          </label>
          <select class="dc-select"><option>分类：全部</option><option>检验报告</option><option>合格证</option><option>资质证书</option><option>其他</option></select>
          <label class="dc-file">＋ <b>选择文件</b> · 未选择</label>
          <input class="dc-note" placeholder="备注（可选）">
          <button class="btn primary">上传</button>
        </div>
      </section>

      <div class="tabs">
        <button class="active">全部 <span class="muted">(1)</span></button>
        <button>检验报告 <span class="muted">(1)</span></button>
        <button>合格证 <span class="muted">(0)</span></button>
        <button>资质证书 <span class="muted">(0)</span></button>
        <button>其他 <span class="muted">(0)</span></button>
      </div>

      <div class="table-card">
        <table style="min-width:760px">
          <thead><tr><th style="width:84px">预览</th><th>标题</th><th>分类</th><th>大小</th><th>上传时间</th><th style="text-align:right">操作</th></tr></thead>
          <tbody>
            <tr>
              <td><div class="dc-preview"></div></td>
              <td><div class="dc-title">演示检验报告</div><div class="dc-sub">演示检验报告.png</div><div class="dc-sub">界面验证用演示文件</div></td>
              <td>检验报告</td><td>339 B</td><td class="muted">2026-11-08 10:09</td>
              <td><div class="row-actions"><button class="btn sm outline">打开</button><button class="btn sm ghost">打印</button><button class="btn sm ghost">下载</button><button class="btn sm ghost">编辑</button><button class="btn sm ghost" style="color:var(--danger);border-color:rgba(199,53,53,.4)">删除</button></div></td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>
</div>
<div class="toast" id="toast"></div>
<script src="_shell.js"></script>
</body></html>
