<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>登录 · {{ shop_name or '消防ERP' }}</title>
  <style>
    :root{
      --bg:#f3f5f8;--surface:#fff;--ink:#172033;--muted:#667085;--border:#dfe3ea;
      --primary:#2563eb;--primary-hover:#1d4ed8;--danger:#b42318;--danger-bg:#fef3f2;
    }
    *{box-sizing:border-box}
    body{
      margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
      background:var(--bg);color:var(--ink);
      font-family:"Microsoft YaHei UI","Segoe UI",system-ui,sans-serif;
      padding:24px;
    }
    .card{
      width:min(420px,100%);background:var(--surface);border:1px solid var(--border);
      border-radius:10px;padding:28px 26px 22px;
      box-shadow:0 1px 2px rgba(16,24,40,.04),0 12px 32px rgba(16,24,40,.08);
    }
    .brand{font-size:13px;color:var(--muted);letter-spacing:.04em;margin-bottom:6px}
    h1{margin:0 0 8px;font-size:24px;font-weight:650}
    .sub{margin:0 0 20px;color:var(--muted);font-size:14px;line-height:1.5}
    label{display:block;font-size:13px;font-weight:600;color:#475467;margin:0 0 6px}
    input{
      width:100%;min-height:42px;border:1px solid #c8ced8;border-radius:6px;
      padding:8px 12px;font-size:15px;margin-bottom:14px;background:#fff;color:var(--ink);
    }
    input:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 3px rgba(37,99,235,.12)}
    .password-field{position:relative;margin-bottom:14px}
    .password-field input{margin-bottom:0;padding-right:44px}
    .eye-btn{
      position:absolute;right:6px;top:50%;transform:translateY(-50%);
      width:34px;height:34px;border:0;border-radius:6px;background:transparent;
      color:var(--muted);cursor:pointer;display:grid;place-items:center;padding:0;
      min-height:0;font-size:inherit;font-weight:inherit;
    }
    .eye-btn:hover{background:#f2f4f7;color:var(--ink)}
    .eye-btn svg{width:18px;height:18px;display:block}
    .eye-btn[aria-pressed="true"]{color:var(--primary)}
    button[type="submit"]{
      width:100%;min-height:44px;border:0;border-radius:6px;background:var(--primary);color:#fff;
      font-size:15px;font-weight:650;cursor:pointer;margin-top:4px;
    }
    button[type="submit"]:hover{background:var(--primary-hover)}
    .error{
      background:var(--danger-bg);color:var(--danger);border:1px solid #fecdca;
      border-radius:7px;padding:10px 12px;font-size:14px;margin-bottom:14px;
    }
  </style>
</head>
<body>
  <form class="card" method="post" action="{{ url_for('auth.login') }}" autocomplete="off">
    <div class="brand">本地桌面版</div>
    <h1>登录</h1>
    <p class="sub">{{ shop_name or '消防 ERP' }} · 请输入用户名和密码后进入系统</p>
    {% if error %}
    <div class="error">{{ error }}</div>
    {% endif %}
    <input type="hidden" name="next" value="{{ next_url or '/' }}">
    <label for="username">用户名</label>
    <input id="username" name="username" required maxlength="64" value="{{ username or '' }}" autofocus>
    <label for="password">密码</label>
    <div class="password-field">
      <input id="password" name="password" type="password" required maxlength="128" autocomplete="current-password">
      <button type="button" class="eye-btn" id="togglePassword" aria-label="显示密码" aria-pressed="false" title="显示/隐藏密码">
        <svg id="eyeIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"></path>
          <circle cx="12" cy="12" r="3"></circle>
        </svg>
      </button>
    </div>
    <button type="submit">进入系统</button>
  </form>
  <script>
    (function () {
      const input = document.getElementById('password');
      const btn = document.getElementById('togglePassword');
      const icon = document.getElementById('eyeIcon');
      if (!input || !btn || !icon) return;

      const eyeOpen = '<path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"></path><circle cx="12" cy="12" r="3"></circle>';
      const eyeOff = '<path d="M3 3l18 18"></path><path d="M10.6 10.6a2 2 0 0 0 2.8 2.8"></path><path d="M9.9 5.1A10.6 10.6 0 0 1 12 5c6.5 0 10 7 10 7a17.7 17.7 0 0 1-3.1 4.1"></path><path d="M6.1 6.1A17.5 17.5 0 0 0 2 12s3.5 7 10 7a10.4 10.4 0 0 0 4.2-.9"></path>';

      btn.addEventListener('click', function () {
        const show = input.type === 'password';
        input.type = show ? 'text' : 'password';
        btn.setAttribute('aria-pressed', show ? 'true' : 'false');
        btn.setAttribute('aria-label', show ? '隐藏密码' : '显示密码');
        icon.innerHTML = show ? eyeOff : eyeOpen;
        input.focus();
      });
    })();
  </script>
</body>
</html>
