<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>{{ title }} · 打印预览</title>
<style>
html,body{margin:0;height:100%;font-family:"Microsoft YaHei",sans-serif;background:#f3f5f7}
.toolbar{height:56px;box-sizing:border-box;display:flex;align-items:center;gap:12px;padding:0 18px;background:#fff;border-bottom:1px solid #d9dee5}
.toolbar strong{font-size:15px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.page-actions{display:flex;align-items:center;gap:8px;margin-left:auto;flex-shrink:0}
.page-actions .btn{display:inline-flex;align-items:center;justify-content:center;box-sizing:border-box;width:112px;min-height:40px;flex-shrink:0;white-space:nowrap;border:0;border-radius:6px;padding:7px 14px;font:600 14px "Microsoft YaHei",sans-serif;color:#fff;text-decoration:none;cursor:pointer}
.pdf-save{background:#0b6b6b}
.page-return{background:#475467;order:99}
.page-actions .btn:hover{filter:brightness(.92)}.page-actions .btn:focus-visible{outline:2px solid #2563eb;outline-offset:2px}.page-actions .btn:disabled{opacity:.6;cursor:wait}
.hint{font-size:13px;color:#667085;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1;min-width:0}
iframe{width:100%;height:calc(100% - 56px);border:0}
@media(max-width:600px){.toolbar{gap:8px;padding:0 10px}.hint{display:none}.toolbar strong{flex:1}}
</style>
</head><body><div class="toolbar"><strong>{{ title }}</strong><span class="hint" id="hint">统一 ERP 打印预览</span><div class="page-actions"><button class="btn pdf-save" id="savePdf" type="button">保存 PDF</button><a class="btn page-return" id="returnToErp" href="{{ return_url }}">返回上一级</a></div></div><iframe src="{{ pdf_url }}" title="{{ title }}"></iframe>
<script>
const btn=document.getElementById('savePdf'),hint=document.getElementById('hint');
btn.addEventListener('click',async()=>{if(!(window.pywebview&&window.pywebview.api&&window.pywebview.api.save_pdf)){hint.textContent='当前不是桌面版，浏览器可使用下载按钮保存。';return}btn.disabled=true;hint.textContent='正在准备 PDF...';try{const r=await fetch({{ pdf_url|tojson }});if(!r.ok)throw new Error('无法读取 PDF');const blob=await r.blob();const data=await new Promise((ok,bad)=>{const f=new FileReader();f.onload=()=>ok(f.result);f.onerror=bad;f.readAsDataURL(blob)});const result=await window.pywebview.api.save_pdf({{ filename|tojson }},data);hint.textContent=result&&result.ok?'已保存：'+result.path:(result&&result.cancelled?'已取消':(result&&result.message)||'保存失败');}catch(e){hint.textContent='保存失败：'+e.message}finally{btn.disabled=false}});
</script></body></html>
