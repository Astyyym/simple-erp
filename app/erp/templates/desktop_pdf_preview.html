<!doctype html>
<html><head><meta charset="utf-8"><title>{{ title }}</title>
<style>html,body{margin:0;height:100%;font-family:"Microsoft YaHei",sans-serif;background:#f3f5f7}.toolbar{height:52px;box-sizing:border-box;display:flex;align-items:center;gap:12px;padding:0 16px;background:#fff;border-bottom:1px solid #d9dee5}.toolbar strong{font-size:15px}.toolbar button{margin-left:auto;background:#0b6b6b;color:#fff;border:0;border-radius:4px;padding:8px 14px;font-size:14px;cursor:pointer}.toolbar button:disabled{opacity:.6}.hint{font-size:13px;color:#667085}iframe{width:100%;height:calc(100% - 52px);border:0}</style>
</head><body><div class="toolbar"><strong>{{ title }}</strong><span class="hint" id="hint"></span><button id="savePdf">保存 PDF</button></div><iframe src="{{ pdf_url }}" title="{{ title }}"></iframe>
<script>
const btn=document.getElementById('savePdf'),hint=document.getElementById('hint');
btn.addEventListener('click',async()=>{if(!(window.pywebview&&window.pywebview.api&&window.pywebview.api.save_pdf)){hint.textContent='当前不是桌面版，浏览器可使用下载按钮保存。';return}btn.disabled=true;hint.textContent='正在准备 PDF...';try{const r=await fetch({{ pdf_url|tojson }});if(!r.ok)throw new Error('无法读取 PDF');const blob=await r.blob();const data=await new Promise((ok,bad)=>{const f=new FileReader();f.onload=()=>ok(f.result);f.onerror=bad;f.readAsDataURL(blob)});const result=await window.pywebview.api.save_pdf({{ filename|tojson }},data);hint.textContent=result&&result.ok?'已保存：'+result.path:(result&&result.cancelled?'已取消':(result&&result.message)||'保存失败');}catch(e){hint.textContent='保存失败：'+e.message}finally{btn.disabled=false}});
</script></body></html>
