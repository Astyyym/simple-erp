  <script>
    // Keep Bootstrap's own theme in sync with the app theme so uncovered
    // Bootstrap defaults (form-text, table text, controls) follow dark mode.
    (function () {
      var root = document.documentElement;
      var theme = root.getAttribute('data-ui-theme') || 'light';
      var query = window.matchMedia('(prefers-color-scheme: dark)');
      function apply() {
        var dark = theme === 'dark' || (theme === 'system' && query.matches);
        root.setAttribute('data-bs-theme', dark ? 'dark' : 'light');
      }
      apply();
      if (theme === 'system' && query.addEventListener) query.addEventListener('change', apply);
    })();
  </script>

    *{box-sizing:border-box;-webkit-text-stroke-width:var(--erp-font-stroke-width,0px);-webkit-text-stroke-color:currentColor}
    html,body{height:100%;margin:0}
    body{
      background:var(--erp-content-wash),var(--erp-bg);
      color:var(--erp-ink);
      font-family:"Microsoft YaHei UI","Segoe UI",system-ui,-apple-system,sans-serif;
      font-size:15px;line-height:1.5;overflow:hidden
    }
    .app-shell{display:flex;height:100vh;width:100%;overflow:hidden;position:relative}
    .app-shell:before{
      content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
      background:var(--erp-content-mesh);
    }
    .sidebar{
      position:relative;flex:0 0 calc(224px * var(--erp-scale));width:calc(224px * var(--erp-scale));height:100%;
      background:var(--erp-sidebar-glass);color:var(--erp-sidebar-ink);display:flex;flex-direction:column;z-index:100;
      padding:0 12px 18px;overflow-x:hidden;overflow-y:auto;
      border-right:1px solid var(--erp-sidebar-border);
      /* Flat sidebar surface: no glass wash or raised shadow. */
      -webkit-backdrop-filter:none;
      backdrop-filter:none;
      box-shadow:none;
      scrollbar-width:thin;
      scrollbar-color:var(--erp-sidebar-scroll-thumb) transparent;
    }
    .sidebar::-webkit-scrollbar{width:8px}
    .sidebar::-webkit-scrollbar-track{background:transparent}
    .sidebar::-webkit-scrollbar-thumb{min-height:34px;background:var(--erp-sidebar-scroll-thumb);border:2px solid transparent;border-radius:999px;background-clip:padding-box}
    .sidebar:hover::-webkit-scrollbar-thumb{background:var(--erp-sidebar-scroll-thumb-hover);border-width:1px}
    .brand{min-height:calc(72px * var(--erp-scale));display:flex;align-items:center;gap:11px;padding:10px;border-bottom:1px solid var(--erp-sidebar-border);margin-bottom:12px}
    .brand-mark{width:34px;height:34px;border-radius:7px;background:var(--erp-primary);color:#fff;display:grid;place-items:center;box-shadow:inset 0 0 0 1px rgba(255,255,255,.18);flex:0 0 auto}
    .brand-mark svg{width:20px;height:20px;display:block}
    .brand-title{font-size:calc(15px * var(--erp-scale));font-weight:650;letter-spacing:.02em;line-height:1.25}.brand-subtitle{font-size:11px;color:var(--erp-sidebar-muted);margin-top:1px;letter-spacing:.08em}
    .nav-group{flex:0 0 auto}
    .nav-label{margin:0 0 7px;padding:9px 12px;color:var(--erp-sidebar-ink);font-size:calc(14px * var(--erp-scale));font-weight:700;letter-spacing:.04em}
    .nav-section{display:flex;align-items:center;min-height:42px;margin:2px 0;padding:9px 12px;border-radius:7px;color:var(--erp-sidebar-ink);font-size:calc(14px * var(--erp-scale));font-weight:600;text-decoration:none;transition:background .15s,color .15s}
    .nav-section:hover{background:var(--erp-sidebar-hover);color:var(--erp-sidebar-ink)}.nav-section.current{color:var(--erp-sidebar-active-ink)}.nav-section.active{background:var(--erp-sidebar-active);color:var(--erp-sidebar-active-ink)}
    .nav-divider{height:2px;flex:none;background:var(--erp-sidebar-border);margin:20px 0 14px}
    .sidebar a{position:relative;color:var(--erp-sidebar-ink);display:flex;align-items:center;min-height:42px;padding:9px 12px;margin:2px 0;text-decoration:none;border-radius:7px;font-weight:500;font-size:calc(14px * var(--erp-scale));transition:background .15s,color .15s}
    .sidebar a.nav-section{font-weight:700;letter-spacing:.04em}
    .sidebar a:hover{background:var(--erp-sidebar-hover);color:var(--erp-sidebar-ink)}.sidebar a.active{background:var(--erp-sidebar-active);color:var(--erp-sidebar-active-ink);font-weight:600}
    .sidebar a.sidebar-sub{min-height:34px;margin-left:14px;padding:6px 12px 6px 20px;font-size:calc(13px * var(--erp-scale));color:var(--erp-sidebar-muted);background:transparent}
    .sidebar a.sidebar-sub:before{content:"";position:absolute;left:7px;width:5px;height:5px;border-radius:50%;background:var(--erp-sidebar-muted)}
    .sidebar a.sidebar-sub:hover{color:var(--erp-sidebar-ink);background:var(--erp-sidebar-hover)}.sidebar a.sidebar-sub.active{color:var(--erp-sidebar-active-ink);background:var(--erp-sidebar-active)}.sidebar a.sidebar-sub.active:before{background:var(--erp-primary)}
    .app-version{margin-top:auto;padding:12px;color:var(--erp-sidebar-muted);font-size:12px;border-top:1px solid var(--erp-sidebar-border)}
    /*
      Topbar stays outside the scrollport:
      - keeps glassmorphism
      - page body scrolls in a sibling pane, so content never peeks through the topbar
    */
    .content{
      position:relative;z-index:1;flex:1 1 auto;min-width:0;height:calc(100% - 28px);margin:14px;
      display:flex;flex-direction:column;overflow:hidden;padding:0;
      border:1px solid rgba(255,255,255,.88);border-radius:26px;background:var(--erp-surface);box-shadow:var(--erp-glass-shadow);
    }
    .page-topbar{
      display:flex;align-items:center;justify-content:space-between;
      flex:0 0 auto;margin:0;padding:0 30px;min-height:58px;
      position:relative;z-index:50;
      background:var(--erp-glass-bg);
      border-bottom:1px solid var(--erp-glass-border);
      -webkit-backdrop-filter:blur(var(--erp-glass-blur)) saturate(1.3);
      backdrop-filter:blur(var(--erp-glass-blur)) saturate(1.3);
      box-shadow:0 8px 24px rgba(16,24,40,.06);
    }
    .page-body{
      flex:1 1 auto;min-height:0;overflow:auto;
      padding:26px 30px 48px;
    }
    .page-topbar .company{font-size:calc(13px * var(--erp-scale));color:var(--erp-muted)}
    .page-topbar .status-wrap{display:flex;align-items:center;gap:12px}
    .page-topbar .status{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--erp-success)}
    .page-topbar .status:before{content:"";width:7px;height:7px;border-radius:50%;background:#22c55e;box-shadow:0 0 0 3px rgba(34,197,94,.18)}
    /* E8：状态点由 /health 实际结果驱动；失败时变红并给出提示文案。 */
    .page-topbar .status.status-down{color:var(--erp-danger)}
    .page-topbar .status.status-down:before{background:var(--erp-danger);box-shadow:0 0 0 3px color-mix(in srgb,var(--erp-danger) 22%,transparent)}
    .logout-form{margin:0}
    .logout-form .btn{min-height:30px;font-size:12px;padding:3px 10px}
    h1,h2,h3,h4{color:var(--erp-ink);font-weight:650;letter-spacing:-.02em}h1{font-size:calc(28px * var(--erp-scale))}h2{font-size:calc(23px * var(--erp-scale));margin-bottom:20px}h3{font-size:calc(18px * var(--erp-scale));margin-top:26px}h4{font-size:16px}
    .text-muted{color:var(--erp-muted)!important}.lead{color:var(--erp-muted);font-size:16px}
    /* .btn 必须自身居中：Bootstrap 的 inline-block 在 flex/grid 父容器里会被 blockify 成 block，
       min-height 富余空间全堆到内容下方，文字整体上浮（实测最大 -3px）。inline-flex + align-items
       让标签在任何父容器下都垂直/水平居中。 */
    .btn{display:inline-flex;align-items:center;justify-content:center;min-height:38px;border-radius:6px;font-size:14px;font-weight:600;padding:7px 14px;box-shadow:none!important}.btn-sm{min-height:31px;font-size:13px;padding:4px 10px}.btn-lg{min-height:44px;font-size:15px;padding:9px 18px}
    .page-header{display:flex;flex-wrap:wrap;align-items:center;gap:12px 20px;margin-bottom:20px}
    .page-header>h1,.page-header>h2,.page-header>div:not(.page-actions){flex:1 1 240px;min-width:0;margin-bottom:0}
    .page-actions{display:flex;flex-wrap:wrap;align-items:center;justify-content:flex-end;gap:8px;margin-left:auto;flex:0 1 auto;min-width:0}
    .page-actions .btn{min-width:96px;min-height:40px;white-space:nowrap;flex-shrink:0}
    .page-actions .page-return{order:99;margin-left:auto;width:112px}
    .order-detail-header{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center}
    .order-detail-header h2{overflow-wrap:anywhere}
    .order-detail-header .page-actions{flex-wrap:nowrap}
    .btn-primary{background:var(--erp-primary);border-color:var(--erp-primary)}.btn-primary:hover,.btn-primary:focus{background:var(--erp-primary-hover);border-color:var(--erp-primary-hover)}
    .btn-secondary{background:#475467;border-color:#475467}.btn-success{background:var(--erp-success);border-color:var(--erp-success)}.btn-danger{background:var(--erp-danger);border-color:var(--erp-danger)}
    .btn-info{background:#eaf2ff;border-color:#c9dcff;color:#1d4ed8}.btn-info:hover{background:#dbeafe;border-color:#aac7ff;color:#1e40af}.btn-warning{background:#f59e0b;border-color:#f59e0b;color:#fff}
    html[data-ui-theme="dark"] .btn-info{background:var(--erp-primary-soft);border-color:var(--erp-border-strong);color:var(--erp-primary)}html[data-ui-theme="dark"] .btn-info:hover{background:#243147;color:var(--erp-primary-hover)}
    @media (prefers-color-scheme: dark){html[data-ui-theme="system"] .btn-info{background:var(--erp-primary-soft);border-color:var(--erp-border-strong);color:var(--erp-primary)}html[data-ui-theme="system"] .btn-info:hover{background:#243147;color:var(--erp-primary-hover)}}
    .btn-outline-secondary{color:var(--erp-muted);border-color:var(--erp-border-strong);background:var(--erp-glass-bg-strong)}.btn-outline-secondary:hover{background:var(--erp-surface-soft);color:var(--erp-ink);border-color:var(--erp-border-strong)}
    /* 行内操作失败的就地提示：不跳页、不用 alert，保留页面上下文。 */
    .row-action-error{
      display:flex;align-items:flex-start;gap:12px;margin:0 0 12px;padding:11px 14px;
      border:1px solid color-mix(in srgb,var(--erp-danger) 34%,var(--erp-border));
      border-radius:6px;background:color-mix(in srgb,var(--erp-danger) 7%,var(--erp-surface));
      font-size:13px;line-height:1.6;
    }
    .row-action-error-text{flex:1 1 auto;min-width:0;color:var(--erp-ink);overflow-wrap:anywhere}
    .row-action-error-close{
      flex:0 0 auto;padding:2px 10px;border:1px solid var(--erp-border-strong);border-radius:4px;
      background:var(--erp-surface);color:var(--erp-muted);font-size:12px;cursor:pointer;
    }
    .row-action-error-close:hover{color:var(--erp-ink);background:var(--erp-surface-soft)}
    /* inputs stay solid for readability on glass panels */
    .form-control,.form-select{min-height:40px;border:1px solid var(--erp-border-strong);border-radius:6px;background:var(--erp-surface);color:var(--erp-ink);font-size:14px;padding:8px 11px;box-shadow:none!important}
    .form-control:focus,.form-select:focus{border-color:var(--erp-primary);box-shadow:0 0 0 3px rgba(37,99,235,.12)!important}.form-control-lg,.form-select-lg{min-height:46px;font-size:15px}.form-label{font-size:13px;font-weight:600;color:var(--erp-muted);margin-bottom:6px}
    form.row{
      background:var(--erp-glass-bg);border:1px solid var(--erp-glass-border);border-radius:var(--erp-radius);padding:14px;margin-left:0;margin-right:0;
      box-shadow:var(--erp-glass-shadow);
      -webkit-backdrop-filter:blur(var(--erp-glass-blur)) saturate(1.25);
      backdrop-filter:blur(var(--erp-glass-blur)) saturate(1.25);
    }
    .table{--bs-table-bg:transparent;margin-bottom:0;color:var(--erp-ink);border-color:var(--erp-border)}
    .table-responsive,.table-shell{
      background:var(--erp-glass-bg);border:1px solid var(--erp-glass-border);border-radius:var(--erp-radius);overflow:hidden;
      box-shadow:var(--erp-glass-shadow);
      -webkit-backdrop-filter:blur(var(--erp-glass-blur)) saturate(1.2);
      backdrop-filter:blur(var(--erp-glass-blur)) saturate(1.2);
    }
    table.table:not(.order-table){
      background:var(--erp-glass-bg);border:1px solid var(--erp-glass-border);box-shadow:var(--erp-glass-shadow);
      -webkit-backdrop-filter:blur(var(--erp-glass-blur)) saturate(1.2);
      backdrop-filter:blur(var(--erp-glass-blur)) saturate(1.2);
    }
    /*
      Batch G｜单层容器原则：每块表格区域视觉上只保留「一层」玻璃，消除
      「表格自身玻璃 + 容器玻璃」的多层叠加（暗色下尤其浑浊）。
      - 裸表格（无包裹容器：单据列表、客户列表、单据详情）：表格自身即唯一一层，保持上面的规则。
      - 容器 > 表格（.table-responsive/.table-shell 直接包裹、外层无卡片）：表格本体去玻璃，容器保留唯一一层玻璃。
      - 玻璃卡片 > 容器 > 表格：表格去玻璃；中间容器降为透明 + 1px 素边框，玻璃只留最外层卡片。
      去玻璃一律用上下文选择器，不全局移除 table.table，避免误伤裸表格页。

    .table-shell>table.table:not(.order-table),
    .card table.table:not(.order-table),

    .table td{font-size:calc(14px * var(--erp-scale));vertical-align:middle;background:transparent}.table-striped>tbody>tr:nth-of-type(odd)>*{--bs-table-accent-bg:rgba(127,127,127,.04)}.table tbody tr:hover>*{background:rgba(37,99,235,.05)}
    .stable-table{table-layout:fixed;width:100%}.stable-table th,.stable-table td{height:52px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.stable-table .action-cell{width:380px;min-width:380px}.stable-table .action-wrap{display:flex;gap:6px;align-items:center;justify-content:flex-start;white-space:nowrap}.stable-table .action-wrap .btn{min-width:60px}.stable-table .deleting{opacity:.45;pointer-events:none}
    .card{
      border:1px solid var(--erp-glass-border);border-radius:var(--erp-radius);box-shadow:var(--erp-glass-shadow);

    */
    .filter-card{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px 20px;align-items:start;padding:18px;margin:0 0 18px;border:1px solid var(--erp-glass-border);border-radius:var(--erp-radius);background:var(--erp-glass-bg);box-shadow:var(--erp-glass-shadow);-webkit-backdrop-filter:blur(var(--erp-glass-blur)) saturate(1.25);backdrop-filter:blur(var(--erp-glass-blur)) saturate(1.25)}
    .filter-card>*{min-width:0}

    .filter-field-date{grid-column:span 2}
    .filter-field-date .date-range{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}

    /* shared two-level product picker (名称 → 型号)，名称与型号同一行并排。

    .product-picker{padding:4px}

    /* 原单关联：置顶一行 + 同层级的原单预览（不浮在明细卡之上） */
    .order-source-row{display:flex;flex-direction:column;gap:6px;padding-bottom:14px;margin-bottom:14px;border-bottom:1px solid var(--erp-border)}
    .order-source-row .form-label{margin-bottom:0}
    .source-preview{background:var(--erp-glass-bg);border:1px solid var(--erp-glass-border);border-radius:var(--erp-radius);padding:16px;margin:0 0 18px;box-shadow:var(--erp-glass-shadow);
      -webkit-backdrop-filter:blur(var(--erp-glass-blur)) saturate(1.25);backdrop-filter:blur(var(--erp-glass-blur)) saturate(1.25)}
    .source-preview.d-none{display:none}
    .source-preview-head{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:10px}
    .source-preview-head .section-title{margin-bottom:0}
    .source-preview-meta{color:var(--erp-muted);font-size:12px}
    .source-preview-table{margin:12px 0 0;min-width:640px}
    .source-preview-table th,.source-preview-table td{white-space:nowrap}
    .source-preview-actions{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin-top:12px}
    .source-preview-actions .form-text{margin:0}
    @supports not ((-webkit-backdrop-filter:blur(1px)) or (backdrop-filter:blur(1px))){
      .order-meta,.order-details-card{background:var(--erp-surface)}
    }
    /* shared panel surfaces used by dashboard / settings */
    .workspace-panel,.settings-card,.quick-card:not(.primary){
      background:var(--erp-glass-bg)!important;border-color:var(--erp-glass-border)!important;box-shadow:var(--erp-glass-shadow)!important;
      -webkit-backdrop-filter:blur(var(--erp-glass-blur)) saturate(1.25);
      backdrop-filter:blur(var(--erp-glass-blur)) saturate(1.25);
    }
    .alert{border-radius:7px;border-width:1px}.table-danger.return-order-row>*{background:#fff1f1!important;color:#a52a2a}.table-danger.return-order-row:hover>*{background:#ffe7e7!important}
    html[data-ui-theme="dark"] .table-danger.return-order-row>*{background:rgba(248,113,113,.12)!important;color:#fecaca}
    @media (prefers-color-scheme: dark){html[data-ui-theme="system"] .table-danger.return-order-row>*{background:rgba(248,113,113,.12)!important;color:#fecaca}}
    /* native controls (date/select/scrollbar) follow the dark theme */
    html[data-ui-theme="dark"]{color-scheme:dark}
    @media (prefers-color-scheme: dark){html[data-ui-theme="system"]{color-scheme:dark}}

    @media (prefers-color-scheme: dark){html[data-ui-theme="system"] .table-light>:not(caption)>*>*{background:var(--erp-glass-bg-strong);color:var(--erp-muted)}}
    input[type=checkbox]{width:16px;height:16px;accent-color:var(--erp-primary)}
    code{color:var(--erp-ink)}
    @supports not ((-webkit-backdrop-filter:blur(1px)) or (backdrop-filter:blur(1px))){
      .sidebar{background:var(--erp-sidebar)}
      .page-topbar,.card,.table-responsive,.table-shell,form.row,table.table:not(.order-table),
      .workspace-panel,.settings-card,.quick-card:not(.primary){
        background:var(--erp-surface)!important;
      }
      /* Batch G 同步：无 blur 环境下，容器内表格仍保持透明，避免与容器重复实色填充。 */
      .table-responsive>table.table:not(.order-table),
      .table-shell>table.table:not(.order-table),
      .card table.table:not(.order-table),
      .today-history table.table:not(.order-table),
      .source-preview table.table:not(.order-table),
      .order-details-card table.table:not(.order-table),

      .stable-table .action-cell{width:300px;min-width:300px}
      /* 窄屏仍保持名称/型号并排；靠 .order-table-scroll 横向滚动，不把下拉压到不可用 */
      .product-picker .picker-row{min-width:300px}

  </style>
  <script>
    async function postAndRemoveRow(form) {
      const row = form.closest('tr');
      if (row) row.classList.add('deleting');
      const response = await fetch(form.action, {method: 'POST', body: new FormData(form), headers: {'X-Requested-With': 'fetch'}});
      if (response.ok) { if (row) row.remove(); return; }
      if (row) row.classList.remove('deleting');
      // 显示后端返回的真实原因，不要用「删除失败，请刷新页面后重试」把原因吞掉。
      let reason = '';
      try {
        const data = await response.json();
        reason = (data && data.error) ? String(data.error) : '';
      } catch (_) { reason = ''; }
      if (!reason) reason = '服务器没有返回具体原因（HTTP ' + response.status + '）。';
      showRowError(row, reason);
    }
    // 就地提示：插在出问题的表格上方，不跳页、不用 alert，避免丢掉页面上下文。
    function showRowError(row, message) {
      const anchor = (row && row.closest('table')) || document.querySelector('table') || document.body;
      let box = document.getElementById('rowActionError');
      if (!box) {
        box = document.createElement('div');
        box.id = 'rowActionError';
        box.className = 'row-action-error';
        box.setAttribute('role', 'alert');
        anchor.parentNode.insertBefore(box, anchor);
      }
      box.replaceChildren();
      const text = document.createElement('span');
      text.className = 'row-action-error-text';
      text.textContent = message;
      const close = document.createElement('button');
      close.type = 'button';
      close.className = 'row-action-error-close';
      close.setAttribute('aria-label', '关闭提示');
      close.textContent = '关闭';
      close.addEventListener('click', () => box.remove());
      box.append(text, close);
      box.scrollIntoView({block: 'nearest'});
    }
    document.addEventListener('submit', async function (event) {
      const form = event.target.closest('form.ajax-delete-form');
      if (!form) return;
      event.preventDefault();
      await postAndRemoveRow(form);
    });
    function toggleAll(source, name) { document.querySelectorAll('input[name="' + name + '"]').forEach(cb => { cb.checked = source.checked; }); }
    function submitSelected(formId, message) {
      const form = document.getElementById(formId);
      if (!form) return false;
      const hasIds = form.querySelector('input[type="checkbox"][name="ids"]:checked') || document.querySelector('input[type="checkbox"][form="' + formId + '"][name="ids"]:checked') || form.querySelector('input[type="hidden"][name="ids"]');
      if (!hasIds) { alert('请先选中要操作的记录'); return false; }
      if (message && !confirm(message)) return false;
      form.submit(); return true;
    }
    // Desktop shell shares session only inside pywebview; keep print/PDF in-shell.
    function isDesktopShell() {
      return document.documentElement && document.documentElement.dataset.desktop === '1';
    }
    function openPrintUrl(url) {
      if (!url) return null;
      const target = new URL(url, window.location.href);
      if (isDesktopShell()) {
        target.searchParams.set('desktop_preview', '1');
        target.searchParams.set('return_to', window.location.pathname + window.location.search);
        window.location.assign(target.href);
        return null;
      }
      return window.open(target.href, '_blank', 'noopener');
    }
  </script>
</head>

<script>
  // Desktop shell: keep native window title in sync with company name.
  (function () {
    const title = {{ (shop_name or '简单ERP')|tojson }};
    try {
      if (window.pywebview && window.pywebview.api && typeof window.pywebview.api.set_window_title === 'function') {
        window.pywebview.api.set_window_title(title);
      }
    } catch (e) {}
  })();
  // E8：状态点反映真实 /health，而不是恒绿静态文案。
  (function () {
    const status = document.getElementById('localStatus');
    if (!status) return;
    fetch('/health', {headers: {'Accept': 'application/json'}})
      .then(response => { if (!response.ok) throw new Error('health ' + response.status); return response.json(); })
      .then(data => {
        if (data && data.status === 'ok') return;
        throw new Error('unhealthy');
      })
      .catch(() => {
        status.classList.add('status-down');
        status.textContent = '本地服务异常';
      });
  })();
</script>
