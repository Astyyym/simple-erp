<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>简单ERPERP</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body{font-size:16px}.sidebar{min-height:100vh;background:#263238}.sidebar a{color:white;display:block;padding:14px 18px;text-decoration:none;border-left:4px solid transparent}.sidebar a:hover{background:#37474f}.sidebar a.active{background:#1565c0;border-left-color:#90caf9;font-weight:700}.sidebar a.sidebar-sub{font-size:14px;padding:8px 18px 8px 42px;background:#2f3d43}.sidebar a.sidebar-sub.active{background:#1976d2}.btn{font-size:16px}.content{padding:24px}.app-version{position:absolute;bottom:14px;left:18px;color:#b0bec5;font-size:13px}
    .stable-table{table-layout:fixed;width:100%}.stable-table th,.stable-table td{height:52px;vertical-align:middle;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.stable-table .action-cell{width:380px;min-width:380px}.stable-table .action-wrap{display:flex;gap:6px;align-items:center;justify-content:flex-start;white-space:nowrap}.stable-table .action-wrap .btn{min-width:64px}.stable-table .deleting{opacity:.45;pointer-events:none}
  </style>
  <script>
    async function postAndRemoveRow(form) {
      const row = form.closest('tr');
      if (row) row.classList.add('deleting');
      const response = await fetch(form.action, {method: 'POST', body: new FormData(form), headers: {'X-Requested-With': 'fetch'}});
      if (response.ok) {
        if (row) row.remove();
      } else {
        if (row) row.classList.remove('deleting');
        alert('删除失败，请刷新页面后重试');
      }
    }
    document.addEventListener('submit', async function (event) {
      const form = event.target.closest('form.ajax-delete-form');
      if (!form) return;
      event.preventDefault();
      await postAndRemoveRow(form);
    });
  </script>
  <script>
    function toggleAll(source, name) {
      document.querySelectorAll('input[name="' + name + '"]').forEach(cb => { cb.checked = source.checked; });
    }
    function submitSelected(formId, message) {
      const form = document.getElementById(formId);
      if (!form) return false;
      const hasIds = form.querySelector('input[type="checkbox"][name="ids"]:checked') || document.querySelector('input[type="checkbox"][form="' + formId + '"][name="ids"]:checked') || form.querySelector('input[type="hidden"][name="ids"]');
      if (!hasIds) {
        alert('请先选中要操作的记录');
        return false;
      }
      if (message && !confirm(message)) return false;
      form.submit();
      return true;
    }
  </script>
</head>
<body>
<div class="container-fluid"><div class="row"><nav class="col-2 sidebar position-relative"><h4 class="text-white p-3">简单ERP阀门ERP</h4>
  <a class="{{'active' if request.path == '/' else ''}}" href="/">首页</a>
  <a class="{{'active' if request.path.startswith('/orders/new') or request.path.startswith('/orders/return/new') else ''}}" href="/orders/new">📝 开单</a>
  <a class="sidebar-sub {{'active' if request.path.startswith('/orders/new') else ''}}" href="/orders/new">销售单</a>
  <a class="sidebar-sub {{'active' if request.path.startswith('/orders/return/new') else ''}}" href="/orders/return/new">退货单</a>
  <a class="{{'active' if request.path.startswith('/orders/') and not request.path.startswith('/orders/new') and not request.path.startswith('/orders/return/new') else ''}}" href="/orders/">📋 单据</a>
  <a class="{{'active' if request.path.startswith('/accounts') else ''}}" href="/accounts/">💰 账款</a>
  <a class="{{'active' if request.path.startswith('/products') else ''}}" href="/products/">📦 商品</a>
  <a class="{{'active' if request.path.startswith('/customers') else ''}}" href="/customers/">👥 客户</a>
  <a class="{{'active' if request.path.startswith('/recycle') else ''}}" href="/recycle/">🗑 回收站</a>
  <div class="app-version">版本 {{app_version}}</div>
</nav><main class="col-10 content">{% block content %}{% endblock %}</main></div></div>
</body></html>
