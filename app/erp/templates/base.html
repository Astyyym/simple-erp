<!doctype html>
<html lang="zh-CN" data-ui-theme="{{ ui_theme or 'light' }}" data-ui-scale="{{ ui_scale or '100' }}" data-desktop="{{ '1' if is_desktop else '0' }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ shop_name or 'ERP' }} · 本地 ERP</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    :root{
      --erp-primary:#2563eb;--erp-primary-hover:#1d4ed8;--erp-primary-soft:#eff6ff;
      --erp-ink:#172033;--erp-muted:#667085;--erp-border:#dfe3ea;--erp-border-strong:#c8ced8;
      --erp-bg:#f3f5f8;--erp-surface:#fff;--erp-surface-soft:#f8fafc;
      --erp-sidebar:#012121;--erp-sidebar-hover:#0a3535;--erp-success:#17803d;--erp-danger:#c73535;
      --erp-radius:8px;--erp-shadow:0 1px 2px rgba(16,24,40,.04),0 8px 24px rgba(16,24,40,.05);
      --erp-scale:1;
      /* stronger glassmorphism tokens (still enterprise, blur capped ~16px) */
      --erp-glass-blur:16px;
      --erp-glass-bg:rgba(255,255,255,.58);
      --erp-glass-bg-strong:rgba(255,255,255,.78);
      --erp-glass-border:rgba(255,255,255,.55);
      --erp-glass-shadow:0 1px 2px rgba(16,24,40,.05),0 14px 36px rgba(16,24,40,.10);
      /* solid brand sidebar color (user-specified) */
      --erp-sidebar-glass:#012121;
      --erp-sidebar-border:rgba(255,255,255,.12);
      --erp-content-wash:linear-gradient(165deg,#d9e6f7 0%,#eef2f8 38%,#e4ebf5 100%);
      --erp-content-mesh:radial-gradient(980px 480px at 10% -10%,rgba(37,99,235,.16),transparent 58%),radial-gradient(760px 400px at 92% 6%,rgba(14,116,144,.10),transparent 52%),radial-gradient(640px 320px at 55% 110%,rgba(99,102,241,.08),transparent 55%);
    }
    html[data-ui-scale="125"]{--erp-scale:1.25}
    html[data-ui-scale="150"]{--erp-scale:1.5}
    html[data-ui-theme="dark"]{
      --erp-primary:#3b82f6;--erp-primary-hover:#60a5fa;--erp-primary-soft:#1e293b;
      --erp-ink:#e8eef9;--erp-muted:#9aa8c0;--erp-border:#2b3648;--erp-border-strong:#3d4b63;
      --erp-bg:#0f141d;--erp-surface:#171e2b;--erp-surface-soft:#1c2535;
      --erp-sidebar:#012121;--erp-sidebar-hover:#0a3535;--erp-success:#34d399;--erp-danger:#f87171;
      --erp-shadow:0 1px 2px rgba(0,0,0,.35),0 8px 24px rgba(0,0,0,.25);
      --erp-glass-blur:16px;
      --erp-glass-bg:rgba(23,30,43,.48);
      --erp-glass-bg-strong:rgba(23,30,43,.70);
      --erp-glass-border:rgba(148,163,184,.22);
      --erp-glass-shadow:0 1px 2px rgba(0,0,0,.40),0 16px 36px rgba(0,0,0,.34);
      --erp-sidebar-glass:#012121;
      --erp-sidebar-border:rgba(255,255,255,.12);
      --erp-content-wash:linear-gradient(165deg,#0a0f18 0%,#101826 46%,#0d1522 100%);
      --erp-content-mesh:radial-gradient(980px 480px at 10% -10%,rgba(59,130,246,.20),transparent 58%),radial-gradient(760px 400px at 92% 6%,rgba(34,211,238,.08),transparent 52%),radial-gradient(640px 320px at 55% 110%,rgba(129,140,248,.10),transparent 55%);
    }
    @media (prefers-color-scheme: dark){
      html[data-ui-theme="system"]{
        --erp-primary:#3b82f6;--erp-primary-hover:#60a5fa;--erp-primary-soft:#1e293b;
        --erp-ink:#e8eef9;--erp-muted:#9aa8c0;--erp-border:#2b3648;--erp-border-strong:#3d4b63;
        --erp-bg:#0f141d;--erp-surface:#171e2b;--erp-surface-soft:#1c2535;
        --erp-sidebar:#012121;--erp-sidebar-hover:#0a3535;--erp-success:#34d399;--erp-danger:#f87171;
        --erp-shadow:0 1px 2px rgba(0,0,0,.35),0 8px 24px rgba(0,0,0,.25);
        --erp-glass-blur:16px;
        --erp-glass-bg:rgba(23,30,43,.48);
        --erp-glass-bg-strong:rgba(23,30,43,.70);
        --erp-glass-border:rgba(148,163,184,.22);
        --erp-glass-shadow:0 1px 2px rgba(0,0,0,.40),0 16px 36px rgba(0,0,0,.34);
        --erp-sidebar-glass:#012121;
        --erp-sidebar-border:rgba(255,255,255,.12);
        --erp-content-wash:linear-gradient(165deg,#0a0f18 0%,#101826 46%,#0d1522 100%);
        --erp-content-mesh:radial-gradient(980px 480px at 10% -10%,rgba(59,130,246,.20),transparent 58%),radial-gradient(760px 400px at 92% 6%,rgba(34,211,238,.08),transparent 52%),radial-gradient(640px 320px at 55% 110%,rgba(129,140,248,.10),transparent 55%);
      }
    }
    *{box-sizing:border-box}
    html,body{height:100%;margin:0}
    body{
      background:var(--erp-content-wash),var(--erp-bg);
      color:var(--erp-ink);
      font-family:"Microsoft YaHei UI","Segoe UI",system-ui,-apple-system,sans-serif;
      font-size:15px;line-height:1.5;overflow:hidden
    }
    .app-shell{display:flex;height:100vh;width:100%;overflow:hidden;position:relative}
    .app-shell:before{
      content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
      background:var(--erp-content-mesh);
    }
    .sidebar{
      position:relative;flex:0 0 calc(224px * var(--erp-scale));width:calc(224px * var(--erp-scale));height:100%;
      background:var(--erp-sidebar-glass);color:#fff;display:flex;flex-direction:column;z-index:100;
      padding:0 12px 18px;overflow:auto;
      border-right:1px solid var(--erp-sidebar-border);
      /* solid brand color #012121 — no glass wash on sidebar */
      -webkit-backdrop-filter:none;
      backdrop-filter:none;
      box-shadow:4px 0 28px rgba(0,0,0,.18);
    }
    .brand{min-height:calc(72px * var(--erp-scale));display:flex;align-items:center;gap:11px;padding:10px;border-bottom:1px solid rgba(255,255,255,.1);margin-bottom:12px}
    .brand-mark{width:34px;height:34px;border-radius:7px;background:var(--erp-primary);display:grid;place-items:center;font-weight:700;font-size:17px;box-shadow:inset 0 0 0 1px rgba(255,255,255,.18);flex:0 0 auto}
    .brand-title{font-size:calc(15px * var(--erp-scale));font-weight:650;letter-spacing:.02em;line-height:1.25}.brand-subtitle{font-size:11px;color:#aeb8ca;margin-top:1px;letter-spacing:.08em}
    .nav-label{margin:12px 4px 7px;padding:8px 10px;color:#dbe7ff;font-size:calc(13px * var(--erp-scale));font-weight:650;letter-spacing:.04em;background:rgba(36,50,74,.62);border:1px solid rgba(91,141,239,.35);border-radius:6px;box-shadow:inset 3px 0 0 #5b8def;-webkit-backdrop-filter:blur(12px) saturate(1.25);backdrop-filter:blur(12px) saturate(1.25)}
    .sidebar a{position:relative;color:#cfd6e3;display:flex;align-items:center;min-height:42px;padding:9px 12px;margin:2px 0;text-decoration:none;border-radius:7px;font-weight:500;font-size:calc(14px * var(--erp-scale));transition:background .15s,color .15s}
    .sidebar a:hover{background:var(--erp-sidebar-hover);color:#fff}.sidebar a.active{background:var(--erp-primary);color:#fff;font-weight:600}
    .sidebar a.sidebar-sub{min-height:34px;margin-left:14px;padding:6px 12px 6px 20px;font-size:calc(13px * var(--erp-scale));color:#aeb8ca;background:transparent}
    .sidebar a.sidebar-sub:before{content:"";position:absolute;left:7px;width:5px;height:5px;border-radius:50%;background:#66758e}
    .sidebar a.sidebar-sub:hover{color:#fff;background:var(--erp-sidebar-hover)}.sidebar a.sidebar-sub.active{color:#fff;background:#263b60}.sidebar a.sidebar-sub.active:before{background:#73a5ff}
    .app-version{margin-top:auto;padding:12px;color:#8290a8;font-size:12px;border-top:1px solid rgba(255,255,255,.08)}
    /*
      Topbar stays outside the scrollport:
      - keeps glassmorphism
      - page body scrolls in a sibling pane, so content never peeks through the topbar
    */
    .content{
      position:relative;z-index:1;flex:1 1 auto;min-width:0;height:100%;
      display:flex;flex-direction:column;overflow:hidden;padding:0;
    }
    .page-topbar{
      display:flex;align-items:center;justify-content:space-between;
      flex:0 0 auto;margin:0;padding:0 30px;min-height:58px;
      position:relative;z-index:50;
      background:var(--erp-glass-bg);
      border-bottom:1px solid var(--erp-glass-border);
      -webkit-backdrop-filter:blur(var(--erp-glass-blur)) saturate(1.3);
      backdrop-filter:blur(var(--erp-glass-blur)) saturate(1.3);
      box-shadow:0 8px 24px rgba(16,24,40,.06);
    }
    .page-body{
      flex:1 1 auto;min-height:0;overflow:auto;
      padding:26px 30px 48px;
    }
    .page-topbar .company{font-size:calc(13px * var(--erp-scale));color:var(--erp-muted)}
    .page-topbar .status-wrap{display:flex;align-items:center;gap:12px}
    .page-topbar .status{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--erp-success)}
    .page-topbar .status:before{content:"";width:7px;height:7px;border-radius:50%;background:#22c55e;box-shadow:0 0 0 3px rgba(34,197,94,.18)}
    .logout-form{margin:0}
    .logout-form .btn{min-height:30px;font-size:12px;padding:3px 10px}
    h1,h2,h3,h4{color:var(--erp-ink);font-weight:650;letter-spacing:-.02em}h1{font-size:calc(28px * var(--erp-scale))}h2{font-size:calc(23px * var(--erp-scale));margin-bottom:20px}h3{font-size:calc(18px * var(--erp-scale));margin-top:26px}h4{font-size:16px}
    .text-muted{color:var(--erp-muted)!important}.lead{color:var(--erp-muted);font-size:16px}
    .btn{min-height:38px;border-radius:6px;font-size:14px;font-weight:600;padding:7px 14px;box-shadow:none!important}.btn-sm{min-height:31px;font-size:13px;padding:4px 10px}.btn-lg{min-height:44px;font-size:15px;padding:9px 18px}
    .btn-primary{background:var(--erp-primary);border-color:var(--erp-primary)}.btn-primary:hover,.btn-primary:focus{background:var(--erp-primary-hover);border-color:var(--erp-primary-hover)}
    .btn-secondary{background:#475467;border-color:#475467}.btn-success{background:var(--erp-success);border-color:var(--erp-success)}.btn-danger{background:var(--erp-danger);border-color:var(--erp-danger)}
    .btn-info{background:#eaf2ff;border-color:#c9dcff;color:#1d4ed8}.btn-info:hover{background:#dbeafe;border-color:#aac7ff;color:#1e40af}.btn-warning{background:#f59e0b;border-color:#f59e0b;color:#fff}
    .btn-outline-secondary{color:#475467;border-color:var(--erp-border-strong);background:var(--erp-glass-bg-strong)}.btn-outline-secondary:hover{background:var(--erp-surface-soft);color:var(--erp-ink);border-color:#98a2b3}
    /* inputs stay solid for readability on glass panels */
    .form-control,.form-select{min-height:40px;border:1px solid var(--erp-border-strong);border-radius:6px;background:var(--erp-surface);color:var(--erp-ink);font-size:14px;padding:8px 11px;box-shadow:none!important}
    .form-control:focus,.form-select:focus{border-color:var(--erp-primary);box-shadow:0 0 0 3px rgba(37,99,235,.12)!important}.form-control-lg,.form-select-lg{min-height:46px;font-size:15px}.form-label{font-size:13px;font-weight:600;color:var(--erp-muted);margin-bottom:6px}
    form.row{
      background:var(--erp-glass-bg);border:1px solid var(--erp-glass-border);border-radius:var(--erp-radius);padding:14px;margin-left:0;margin-right:0;
      box-shadow:var(--erp-glass-shadow);
      -webkit-backdrop-filter:blur(var(--erp-glass-blur)) saturate(1.25);
      backdrop-filter:blur(var(--erp-glass-blur)) saturate(1.25);
    }
    .table{--bs-table-bg:transparent;margin-bottom:0;color:var(--erp-ink);border-color:var(--erp-border)}
    .table-responsive,.table-shell{
      background:var(--erp-glass-bg);border:1px solid var(--erp-glass-border);border-radius:var(--erp-radius);overflow:hidden;
      box-shadow:var(--erp-glass-shadow);
      -webkit-backdrop-filter:blur(var(--erp-glass-blur)) saturate(1.2);
      backdrop-filter:blur(var(--erp-glass-blur)) saturate(1.2);
    }
    table.table:not(.order-table){
      background:var(--erp-glass-bg);border:1px solid var(--erp-glass-border);box-shadow:var(--erp-glass-shadow);
      -webkit-backdrop-filter:blur(var(--erp-glass-blur)) saturate(1.2);
      backdrop-filter:blur(var(--erp-glass-blur)) saturate(1.2);
    }
    .table>:not(caption)>*>*{padding:12px 14px;border-bottom-color:var(--erp-border)}
    .table th{height:44px;background:var(--erp-glass-bg-strong);color:var(--erp-muted);font-size:12px;font-weight:650;letter-spacing:.03em;vertical-align:middle;white-space:nowrap}
    .table td{font-size:14px;vertical-align:middle;background:transparent}.table-striped>tbody>tr:nth-of-type(odd)>*{--bs-table-accent-bg:rgba(127,127,127,.04)}.table tbody tr:hover>*{background:rgba(37,99,235,.05)}
    .stable-table{table-layout:fixed;width:100%}.stable-table th,.stable-table td{height:52px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.stable-table .action-cell{width:380px;min-width:380px}.stable-table .action-wrap{display:flex;gap:6px;align-items:center;justify-content:flex-start;white-space:nowrap}.stable-table .action-wrap .btn{min-width:60px}.stable-table .deleting{opacity:.45;pointer-events:none}
    .card{
      border:1px solid var(--erp-glass-border);border-radius:var(--erp-radius);box-shadow:var(--erp-glass-shadow);
      background:var(--erp-glass-bg);
      -webkit-backdrop-filter:blur(var(--erp-glass-blur)) saturate(1.25);
      backdrop-filter:blur(var(--erp-glass-blur)) saturate(1.25);
    }
    .card-body{padding:18px}
    /* shared panel surfaces used by dashboard / settings */
    .workspace-panel,.settings-card,.quick-card:not(.primary){
      background:var(--erp-glass-bg)!important;border-color:var(--erp-glass-border)!important;box-shadow:var(--erp-glass-shadow)!important;
      -webkit-backdrop-filter:blur(var(--erp-glass-blur)) saturate(1.25);
      backdrop-filter:blur(var(--erp-glass-blur)) saturate(1.25);
    }
    .alert{border-radius:7px;border-width:1px}.table-danger.return-order-row>*{background:#fff1f1!important;color:#a52a2a}.table-danger.return-order-row:hover>*{background:#ffe7e7!important}
    html[data-ui-theme="dark"] .table-danger.return-order-row>*,html[data-ui-theme="system"] .table-danger.return-order-row>*{background:rgba(248,113,113,.12)!important;color:#fecaca}
    input[type=checkbox]{width:16px;height:16px;accent-color:var(--erp-primary)}
    code{color:var(--erp-ink)}
    @supports not ((-webkit-backdrop-filter:blur(1px)) or (backdrop-filter:blur(1px))){
      .sidebar{background:var(--erp-sidebar)}
      .page-topbar,.card,.table-responsive,.table-shell,form.row,table.table:not(.order-table),
      .workspace-panel,.settings-card,.quick-card:not(.primary){
        background:var(--erp-surface)!important;
      }
    }
    @media(max-width:900px){
      .sidebar{flex-basis:calc(190px * var(--erp-scale));width:calc(190px * var(--erp-scale))}
      .page-topbar{padding:0 20px}
      .page-body{padding:20px 20px 32px}
      .stable-table .action-cell{width:300px;min-width:300px}
    }
  </style>
  <script>
    async function postAndRemoveRow(form) {
      const row = form.closest('tr');
      if (row) row.classList.add('deleting');
      const response = await fetch(form.action, {method: 'POST', body: new FormData(form), headers: {'X-Requested-With': 'fetch'}});
      if (response.ok) { if (row) row.remove(); }
      else { if (row) row.classList.remove('deleting'); alert('删除失败，请刷新页面后重试'); }
    }
    document.addEventListener('submit', async function (event) {
      const form = event.target.closest('form.ajax-delete-form');
      if (!form) return;
      event.preventDefault();
      await postAndRemoveRow(form);
    });
    function toggleAll(source, name) { document.querySelectorAll('input[name="' + name + '"]').forEach(cb => { cb.checked = source.checked; }); }
    function submitSelected(formId, message) {
      const form = document.getElementById(formId);
      if (!form) return false;
      const hasIds = form.querySelector('input[type="checkbox"][name="ids"]:checked') || document.querySelector('input[type="checkbox"][form="' + formId + '"][name="ids"]:checked') || form.querySelector('input[type="hidden"][name="ids"]');
      if (!hasIds) { alert('请先选中要操作的记录'); return false; }
      if (message && !confirm(message)) return false;
      form.submit(); return true;
    }
    // Desktop shell shares session only inside pywebview; keep print/PDF in-shell.
    function isDesktopShell() {
      return document.documentElement && document.documentElement.dataset.desktop === '1';
    }
    function openPrintUrl(url) {
      if (!url) return null;
      if (isDesktopShell()) {
        const separator = url.includes('?') ? '&' : '?';
        window.location.assign(url + separator + 'desktop_preview=1');
        return null;
      }
      return window.open(url, '_blank', 'noopener');
    }
  </script>
</head>
<body>
<div class="app-shell">
  <nav class="sidebar">
    <div class="brand"><div class="brand-mark">简</div><div><div class="brand-title">{{ shop_name or '简单ERP' }}</div><div class="brand-subtitle">BUSINESS MANAGEMENT</div></div></div>
    <div class="nav-label">业务中心</div>
    <a class="{{'active' if request.path == '/' else ''}}" href="/">工作台</a>
    <a class="{{'active' if request.path.startswith('/orders/new') or request.path.startswith('/orders/return/new') else ''}}" href="/orders/new">开单</a>
    <a class="sidebar-sub {{'active' if request.path.startswith('/orders/new') else ''}}" href="/orders/new">销售单</a>
    <a class="sidebar-sub {{'active' if request.path.startswith('/orders/return/new') else ''}}" href="/orders/return/new">退货单</a>
    <a class="{{'active' if request.path.startswith('/orders/') and not request.path.startswith('/orders/new') and not request.path.startswith('/orders/return/new') else ''}}" href="/orders/">单据管理</a>
    <a class="{{'active' if request.path.startswith('/accounts') else ''}}" href="/accounts/">账款管理</a>
    <div class="nav-label">基础资料</div>
    <a class="{{'active' if request.path.startswith('/products') else ''}}" href="/products/">商品管理</a>
    <a class="{{'active' if request.path.startswith('/customers') else ''}}" href="/customers/">客户管理</a>
    <a class="{{'active' if request.path.startswith('/recycle') else ''}}" href="/recycle/">回收站</a>
    <div class="nav-label">系统</div>
    <a class="{{'active' if request.path.startswith('/settings') else ''}}" href="/settings/">设置</a>
    <div class="app-version">本地桌面版 · {{app_version}}</div>
  </nav>
  <main class="content">
    <div class="page-topbar">
      <div class="company">{{ shop_name }}</div>
      <div class="status-wrap">
        <div class="status">本地数据已连接</div>
      </div>
    </div>
    <div class="page-body">
      {% block content %}{% endblock %}
    </div>
  </main>
</div>
<script>
  // Desktop shell: keep native window title in sync with company name.
  (function () {
    const title = {{ (shop_name or '简单ERP')|tojson }};
    try {
      if (window.pywebview && window.pywebview.api && typeof window.pywebview.api.set_window_title === 'function') {
        window.pywebview.api.set_window_title(title);
      }
    } catch (e) {}
  })();
</script>
</body>
</html>
