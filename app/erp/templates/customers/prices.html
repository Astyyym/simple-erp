{% extends "base.html" %}
{% block content %}
<header class="page-header">
  <h2>{{customer.name}} - 客户专属价格</h2>
  <div class="page-actions"><a class="btn btn-secondary page-return" href="/customers/">返回</a></div>
</header>
<table class="table"><tr><th>商品</th><th>默认价</th><th>当前专属价</th><th>设置</th></tr>{% for p in products %}<tr><td>{{p.name}} {{p.spec}}</td><td>{{cents_to_yuan(p.default_price_cents)}}</td><td>{{cents_to_yuan(p.customer_price_cents) if p.customer_price_cents else '-'}}</td><td><form class="d-flex gap-2" method="post"><input type="hidden" name="product_id" value="{{p.id}}"><input class="form-control" name="price" placeholder="元"><button class="btn btn-primary">保存</button></form></td></tr>{% endfor %}</table>
{% endblock %}
