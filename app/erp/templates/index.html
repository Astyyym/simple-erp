{% extends "base.html" %}
{% block content %}
<style>
  .dashboard-head{display:flex;align-items:flex-end;justify-content:space-between;margin-bottom:22px}.dashboard-head h1{margin:0 0 5px}.dashboard-head p{margin:0;color:var(--erp-muted)}
  .quick-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-bottom:24px}.quick-card{display:block;padding:18px;background:#fff;border:1px solid var(--erp-border);border-radius:var(--erp-radius);color:var(--erp-ink);text-decoration:none;box-shadow:var(--erp-shadow);transition:transform .15s,border-color .15s}.quick-card:hover{transform:translateY(-1px);border-color:#a9c5ff;color:var(--erp-ink)}.quick-card.primary{background:var(--erp-primary);border-color:var(--erp-primary);color:#fff}.quick-card.primary:hover{color:#fff;background:var(--erp-primary-hover)}.quick-card .eyebrow{font-size:12px;color:var(--erp-muted);margin-bottom:12px}.quick-card.primary .eyebrow{color:#dbeafe}.quick-card strong{display:block;font-size:17px;margin-bottom:5px}.quick-card span{font-size:13px;color:var(--erp-muted)}.quick-card.primary span{color:#dbeafe}
  .workspace-panel{background:#fff;border:1px solid var(--erp-border);border-radius:var(--erp-radius);padding:20px;box-shadow:var(--erp-shadow)}.workspace-panel h3{margin:0 0 8px}.workspace-panel p{color:var(--erp-muted);margin:0 0 18px}.flow{display:grid;grid-template-columns:repeat(4,1fr);gap:0}.flow-step{position:relative;padding:14px 16px;background:#f8fafc;border:1px solid var(--erp-border)}.flow-step:not(:last-child){border-right:0}.flow-step:first-child{border-radius:7px 0 0 7px}.flow-step:last-child{border-radius:0 7px 7px 0}.flow-step b{display:block;font-size:13px;margin-bottom:3px}.flow-step small{color:var(--erp-muted)}
  @media(max-width:1100px){.quick-grid{grid-template-columns:repeat(2,1fr)}}
</style>
<div class="dashboard-head">
  <div><h1>业务工作台</h1><p>常用业务入口集中在这里，开单、查询和维护可以直接进入。</p></div>
  <div class="text-muted small">简单ERP</div>
</div>
<div class="quick-grid">
  <a class="quick-card primary" href="/orders/new"><div class="eyebrow">快捷开单</div><strong>新建销售单</strong><span>录入商品并保存打印</span></a>
  <a class="quick-card" href="/orders/return/new"><div class="eyebrow">退货业务</div><strong>新建退货单</strong><span>沿用销售单录入流程</span></a>
  <a class="quick-card" href="/orders/"><div class="eyebrow">业务查询</div><strong>单据查询</strong><span>筛选、回看、编辑和打印</span></a>
  <a class="quick-card" href="/accounts/"><div class="eyebrow">应收管理</div><strong>账款管理</strong><span>客户余额、收款与汇总</span></a>
</div>
<div class="workspace-panel">
  <h3>日常业务流程</h3><p>界面按小型 ERP 的高频操作组织，保留原有功能和数据结构。</p>
  <div class="flow">
    <div class="flow-step"><b>1. 维护资料</b><small>客户与商品字典</small></div>
    <div class="flow-step"><b>2. 销售 / 退货</b><small>Excel 式逐行录入</small></div>
    <div class="flow-step"><b>3. 打印单据</b><small>保存后打开打印页</small></div>
    <div class="flow-step"><b>4. 核对账款</b><small>查询余额与汇总表</small></div>
  </div>
</div>
{% endblock %}
